<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>สั่งซื้อสินค้า | Body Scent</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="site-header">
    <div class="container site-header__inner">
      <a class="logo" href="index.html">Body Scent</a>
      <ul class="nav">
        <li><a href="index.html">หน้าแรก</a></li>
        <li><a href="product.html">สินค้า</a></li>
      </ul>
    </div>
  </header>

  <main>
    <section class="section">
      <div class="container container--narrow">
        <div class="section__header">
          <h1 class="page-title">สั่งซื้อสินค้า</h1>
          <p>กรอกข้อมูลสำหรับติดต่อกลับ แล้วกดยืนยันสั่งซื้อ</p>
        </div>

        <form id="orderForm" class="form">
          <div class="form__field">
            <label for="customerName">ชื่อลูกค้า</label>
            <input type="text" id="customerName" name="customerName" autocomplete="name" required>
          </div>

          <div class="form__field">
            <label for="contact">เบอร์โทร / Line</label>
            <input type="text" id="contact" name="contact" autocomplete="tel" required>
          </div>

          <div class="form__field">
            <label for="items">รายการสินค้า</label>
            <input type="text" id="items" name="items" readonly required>
          </div>

          <div class="form__field">
            <label for="total">จำนวนเงินรวม (บาท)</label>
            <input type="text" id="total" name="total" readonly required>
          </div>

          <div class="form__field">
            <label for="note">หมายเหตุ</label>
            <textarea id="note" name="note"></textarea>
          </div>

          <button type="submit" class="btn btn--block">ยืนยันสั่งซื้อ</button>
          <p class="small text-center mb-0">ยังไม่ได้เลือกสินค้า? <a href="product.html">ไปที่หน้าสินค้า</a></p>
        </form>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>&copy; Body Scent</p>
    </div>
  </footer>

  <script src="script.js"></script>
</body>
</html>
